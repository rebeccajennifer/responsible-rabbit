<svg baseProfile="tiny" height="8.5in" version="1.2" width="11in" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><g transform="translate(24.0, 24.0)"><rect fill="none" height="768.0" stroke="#008080" width="408.0" x="0" y="0" /><g transform="translate(10, 10)"><rect fill="none" height="22" stroke="#008080" stroke-width="1" width="388.0" x="0" y="0" /><text alignment-baseline="text-after-edge" fill="#444444" font-family="Trebuchet MS" font-size="12" text-anchor="start" transform="translate(5,17)">12 Week Potential</text></g><g transform="translate(10, 32)"><g transform="translate(0,0)"><rect fill="none" height="106.0" stroke="#008080" stroke-width="1" width="388.0" x="0" y="0" /><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,17.0)">Imagine how your life will change over the next twelve weeks. Aim</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,29.0)">for progress that feels bold but within your reach. What fears</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,41.0)">will you face head-on? What talents will you grow? What knowledge</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,53.0)">will you seek out? What routines will help—or hold you back? Who</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,65.0)">will you spend time with? How will you relax or have fun? What</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,77.0)">kind of home life do you want? What will change at work or with</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,89.0)">money? How will you evolve as a person? Who are you choosing to</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,101.0)">become?</text></g><g transform="translate(0,106.0)"><g><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,31.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,62.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,93.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,124.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,155.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,186.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,217.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,248.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,279.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,310.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,341.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,372.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,403.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,434.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,465.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,496.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,527.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,558.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,589.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,620.0)" x1="0" x2="388.0" y1="0" y2="0" /></g><g><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,20.666666666666664)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,51.666666666666664)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,82.66666666666666)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,113.66666666666666)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,144.66666666666666)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,175.66666666666666)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,206.66666666666666)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,237.66666666666666)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,268.66666666666663)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,299.66666666666663)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,330.66666666666663)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,361.66666666666663)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,392.66666666666663)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,423.66666666666663)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,454.66666666666663)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,485.66666666666663)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,516.6666666666666)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,547.6666666666666)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,578.6666666666666)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,0" stroke-width="1" transform="translate(0,609.6666666666666)" x1="0" x2="388.0" y1="0" y2="0" /></g></g></g></g><g transform="translate(624.0, 24.0)"><rect fill="none" height="768.0" stroke="#008080" width="408.0" x="0" y="0" /><g transform="translate(10, 10)"><rect fill="none" height="22" stroke="#008080" stroke-width="1" width="388.0" x="0" y="0" /><text alignment-baseline="text-after-edge" fill="#444444" font-family="Trebuchet MS" font-size="12" text-anchor="start" transform="translate(5,17)">The Consequences of Inaction</text></g><g transform="translate(10, 32)"><g transform="translate(0,0)"><rect fill="none" height="70.0" stroke="#008080" stroke-width="1" width="388.0" x="0" y="0" /><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,17.0)">Though it may feel unsettling, envision the genuine consequences</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,29.0)">of not honoring your commitments. Picture the most serious yet</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,41.0)">believable outcome. What does that scenario look like? Who do you</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,53.0)">become, and how are your health, finances, and relationships</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,65.0)">affected?</text></g><g transform="translate(0,70.0)"><g><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,32.8)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,65.6)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,98.39999999999999)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,131.2)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,164.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,196.8)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,229.60000000000002)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,262.40000000000003)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,295.20000000000005)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,328.00000000000006)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,360.80000000000007)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,393.6000000000001)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,426.4000000000001)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,459.2000000000001)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,492.0000000000001)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,524.8000000000001)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,557.6)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,590.4)" x1="0" x2="388.0" y1="0