art" transform="translate(5,65.0)">emotionally. What changes do you want to see in your work, your</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,77.0)">relationships, and your overall well-being?</text></g><g transform="translate(0,82.0)"><g><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,32.2)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,64.4)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,96.60000000000001)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,128.8)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,161.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,193.2)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,225.39999999999998)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,257.59999999999997)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,289.79999999999995)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,321.99999999999994)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,354.19999999999993)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,386.3999999999999)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-das