<svg baseProfile="tiny" height="8.5in" version="1.2" width="11in" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><g transform="translate(24.0, 24.0)"><rect fill="none" height="768.0" stroke="#008080" width="408.0" x="0" y="0" /><g transform="translate(10, 10)"><rect fill="none" height="22" stroke="#008080" stroke-width="1" width="388.0" x="0" y="0" /><text alignment-baseline="text-after-edge" fill="#444444" font-family="Trebuchet MS" font-size="12" text-anchor="start" transform="translate(5,17)">A Commitment to Growth</text><g transform="translate(215.04,0)"><text alignment-baseline="text-after-edge" fill="#444444" font-family="Trebuchet MS" font-size="12" text-anchor="start" transform="translate(5,17)">              /              /  20          </text></g></g><g transform="translate(10, 32)"><g transform="translate(0,0)"><rect fill="none" height="94.0" stroke="#008080" stroke-width="1" width="388.0" x="0" y="0" /><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,17.0)">I, (your name), vow to be true to my word and to live with</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,29.0)">intention. I will no longer treat my time as something to be taken</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,41.0)">for granted. From this moment on, I commit to striving for my</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,53.0)">fullest potential—for myself, for those I care about, and for the</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,65.0)">greater good. I promise to dedicate time to this journal asoften</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,77.0)">as I am able, and through this practice, to bring my dreams, my</text><text alignment-baseline="text-after-edge" fill="#444444" font-family="Ubuntu Mono" font-size="10" text-anchor="start" transform="translate(5,89.0)">purpose, and my highest self into being.</text></g><g transform="translate(0,94.0)"><g><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,31.6)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,63.2)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,94.80000000000001)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,126.4)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,158.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,189.6)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,221.2)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,252.79999999999998)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,284.4)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,316.0)" x1="0" x2="388.0" y1="0" y2="0" /><line stroke="#888888" stroke-dasharray="1,5" stroke-width="1" transform="translate(0,347.6)" x1="0" x2="388.0" y1="0" y2="0" /><line s